<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Notas de obra</title>
<meta name="theme-color" content="#1f2a44">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#f3f1ec; --surface:#ffffff; --surface2:#f8f7f4; --ink:#1c1f26; --muted:#6b6f78; --line:#e2dfd8;
  --accent:#d9480f; --accent-ink:#ffffff; --desk:#d9d6cf; --shadow:0 1px 2px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.06);
  --sel:#fde8dc;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181d; --surface:#1f2228; --surface2:#262a31; --ink:#eceae5; --muted:#9a9ea7; --line:#33373f;
    --accent:#ff7a3d; --accent-ink:#1a0c04; --desk:#0f1114; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
    --sel:#3a2418;
  }
}
:root[data-theme="dark"]{
  --bg:#16181d; --surface:#1f2228; --surface2:#262a31; --ink:#eceae5; --muted:#9a9ea7; --line:#33373f;
  --accent:#ff7a3d; --accent-ink:#1a0c04; --desk:#0f1114; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  --sel:#3a2418;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
[hidden]{display:none!important}

/* Biblioteca */
#lib{height:100%;overflow:auto;padding:0 16px calc(24px + env(safe-area-inset-bottom))}
.lhead{position:sticky;top:0;z-index:2;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 0 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.lhead h1{font-size:22px;margin:0;flex:1 1 100%;letter-spacing:-.01em}
.lhead .btn{flex:1;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);font-weight:600;font-size:14px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn svg.i{width:18px;height:18px}
.search{width:100%;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:6px}
.card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;text-align:left}
.card .th{aspect-ratio:3/4;background:var(--surface2) center/contain no-repeat;border-bottom:1px solid var(--line)}
.card .meta{display:flex;align-items:center;gap:4px;padding:8px 6px 8px 10px}
.card .t{flex:1;min-width:0}
.card .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .t span{font-size:12px;color:var(--muted)}
.card .more{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.empty{margin:60px auto;max-width:340px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.foot{margin-top:24px;font-size:12px;color:var(--muted);text-align:center}

/* Editor */
#ed{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--desk)}
.ebar{display:flex;align-items:center;gap:2px;padding:calc(6px + env(safe-area-inset-top)) 6px 4px;background:var(--surface);border-bottom:1px solid var(--line)}
.ebar .title{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px;text-align:left;height:40px}
.ib{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;position:relative}
.ib:disabled{opacity:.35}
.ib.on{background:var(--sel);color:var(--accent)}
.tools{display:flex;align-items:center;gap:2px;padding:4px 6px 6px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.sep{width:1px;height:26px;background:var(--line);margin:0 4px;flex:none}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1.5px var(--line)}
.ib small{position:absolute;bottom:1px;left:0;right:0;font-size:9px;text-align:center;color:var(--muted);font-weight:600}
#host{position:relative;flex:1;overflow:hidden}
#view{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#loupe{position:absolute;width:128px;height:128px;border-radius:50%;box-shadow:0 0 0 2px var(--surface),0 4px 18px rgba(0,0,0,.35);pointer-events:none}
.mbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:6px;align-items:center;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:6px 6px 6px 12px;max-width:calc(100% - 24px)}
.mbar span{font-size:13px;font-weight:600;white-space:nowrap;margin-right:4px}
.mbar .btn{height:36px;box-shadow:none;background:var(--surface2);padding:0 10px}
.mbar .btn.pri{background:var(--accent)}
.zoomtag{position:absolute;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));font-size:12px;background:var(--surface);color:var(--muted);padding:3px 8px;border-radius:8px;box-shadow:var(--shadow);pointer-events:none}
.scaletag{position:absolute;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));font-size:12px;background:var(--surface);padding:3px 8px;border-radius:8px;box-shadow:var(--shadow)}
.scaletag.no{color:var(--accent);font-weight:600}

/* Popover y hojas */
.pop{position:fixed;z-index:20;background:var(--surface);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.25);padding:12px;width:min(300px,calc(100vw - 24px))}
.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-bottom:12px}
.pal button{aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 1.5px var(--line)}
.pal button.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.pop label{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.pop input[type=range]{flex:1;accent-color:var(--accent)}
.prev{height:36px;display:grid;place-items:center;margin-top:6px}
.scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheet h2{font-size:18px;margin:0 0 10px}
.sheet p{margin:0 0 12px;color:var(--muted);font-size:13px}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.sheet .acts .btn{box-shadow:none;background:var(--surface2)}
.sheet .acts .btn.pri{background:var(--accent)}
.sheet .acts .btn.danger{background:#c92a2a;color:#fff}
.field{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);padding:0 12px;font:inherit;font-size:16px}
textarea.field{height:110px;padding:10px 12px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.chip{height:36px;padding:0 12px;border-radius:18px;background:var(--surface2);border:1px solid var(--line);font-weight:600;font-size:14px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{display:flex;align-items:center;gap:8px;margin:8px 0}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin:10px 0}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.mlist{list-style:none;margin:0;padding:0}
.mlist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.mlist .dot{width:10px;height:10px;border-radius:50%;flex:none}
.mlist .tx{flex:1;min-width:0;text-align:left}
.mlist .tx b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.mlist .tx span{font-size:12px;color:var(--muted)}
.tot{display:flex;gap:10px;margin-bottom:6px}
.tot div{flex:1;background:var(--surface2);border-radius:12px;padding:10px 12px}
.tot span{display:block;font-size:12px;color:var(--muted)}
.tot b{font-size:18px;font-variant-numeric:tabular-nums}
.menu{display:flex;flex-direction:column}
.menu button{display:flex;align-items:center;gap:12px;padding:12px 4px;text-align:left;border-bottom:1px solid var(--line)}
.menu button:last-child{border-bottom:0}
.menu .sw2{margin-left:auto;width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none}
.menu .sw2::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.menu .sw2.on{background:var(--accent)}
.menu .sw2.on::after{left:21px}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1c1f26;color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;z-index:40;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.3)}
.busy{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(0,0,0,.25);color:#fff;font-weight:600}
.busy div{background:#1c1f26;padding:14px 18px;border-radius:14px}
</style>
</head>

<!-- Biblioteca -->

<script>
(() => {
'use strict';
const PDFJS_BASE = 'lib/';
const $ = s => document.querySelector(s);
const PT_MM = 25.4 / 72;
const COLORS = ['#1c1f26','#e03131','#1971c2','#2f9e44','#f08c00','#9c36b5','#868e96','#ffffff'];
const HL_COLORS = ['#ffd43b','#69db7c','#74c0fc','#ffa8a8','#e599f7','#ffc078','#ced4da','#63e6be'];
const MCOL = {len:'#d9480f', poly:'#1971c2', area:'#2f9e44', cal:'#9c36b5'};
const MNAME = {len:'Longitud', poly:'Recorrido', area:'Área'};
const nf = (v, d=2) => v.toLocaleString('es-ES',{minimumFractionDigits:d, maximumFractionDigits:d});
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

/* ---------- Preferencias (por dispositivo) ---------- */
const prefs = Object.assign({
  pen:{c:'#1c1f26', w:2.2}, hl:{c:'#ffd43b', w:18}, text:{c:'#1c1f26', w:16}, penOnly:false
}, (() => { try { return JSON.parse(localStorage.getItem('notasObra.prefs') || '{}'); } catch(e){ return {}; } })());
const savePrefs = () => { try { localStorage.setItem('notasObra.prefs', JSON.stringify(prefs)); } catch(e){} };

/* ---------- Almacenamiento: IndexedDB con respaldo en memoria ---------- */
const DB = {
  db:null, mem:{notes:new Map(), pdfs:new Map(), ann:new Map()},
  async open(){
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('notasObra', 1);
        r.onupgradeneeded = () => { const d = r.result; ['notes','pdfs','ann'].forEach(s => { if(!d.objectStoreNames.contains(s)) d.createObjectStore(s); }); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
        setTimeout(() => rej(new Error('IndexedDB no responde')), 4000);
      });
    } catch(e){ this.db = null; }
  },
  _req(store, mode, fn){
    return new Promise((res, rej) => { const t = this.db.transaction(store, mode); const r = fn(t.objectStore(store)); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
  },
  async get(s,k){ if(this.db) try { return await this._req(s,'readonly',o=>o.get(k)); } catch(e){} return this.mem[s].get(k); },
  async put(s,k,v){ this.mem[s].set(k,v); if(this.db) try { await this._req(s,'readwrite',o=>o.put(v,k)); } catch(e){ console.warn(e); } },
  async del(s,k){ this.mem[s].delete(k); if(this.db) try { await this._req(s,'readwrite',o=>o.delete(k)); } catch(e){} },
  async all(s){ if(this.db) try { return await this._req(s,'readonly',o=>o.getAll()); } catch(e){} return [...this.mem[s].values()]; }
};

/* ---------- UI genérica ---------- */
let toastT;
function toast(msg, ms=2600){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, ms); }
function busy(msg){ const b=document.createElement('div'); b.className='busy'; b.innerHTML='<div></div>'; b.firstChild.textContent=msg; document.body.appendChild(b); return () => b.remove(); }
function sheet(build){
  return new Promise(resolve => {
    const scrim = document.createElement('div'); scrim.className='scrim';
    const sh = document.createElement('div'); sh.className='sheet'; scrim.appendChild(sh);
    const close = v => { scrim.remove(); resolve(v); };
    scrim.addEventListener('pointerdown', e => { if(e.target===scrim) close(null); });
    build(sh, close);
    document.body.appendChild(scrim);
    const f = sh.querySelector('[autofocus]'); if(f) setTimeout(()=>{ f.focus(); f.select && f.select(); }, 50);
  });
}
function h(tag, attrs={}, ...kids){
  const el = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='class') el.className=v; else if(k.startsWith('on')) el.addEventListener(k.slice(2), v); else if(v!==false && v!=null) el.setAttribute(k, v===true?'':v); }
  for(const kid of kids.flat()) if(kid!=null) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}
function acts(...btns){ return h('div',{class:'acts'}, ...btns); }
function askText(title, value='', {label='Guardar', multiline=false, hint=''}={}){
  return sheet((sh, close) => {
    const inp = multiline ? h('textarea',{class:'field', autofocus:true}) : h('input',{class:'field', autofocus:true});

/* ---------- PDF.js ---------- */
let pdfReady;
function initPdf(){
  if(pdfReady) return pdfReady;
  pdfReady = (async () => {
    if(!window.pdfjsLib) throw new Error('No se pudo cargar el lector de PDF');
    try {
      const r = await fetch(PDFJS_BASE + 'pdf.worker.min.js'); const t = await r.text();
      pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([t], {type:'text/javascript'}));
    } catch(e){ pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + 'pdf.worker.min.js'; }
  })();
  return pdfReady;
}
let mainThread = null;
function useMainThread(){
  // Respaldo: cargar el motor del PDF en la propia página si el worker no arranca
  if(!mainThread) mainThread = new Promise((res, rej) => { const s = document.createElement('script'); s.src = PDFJS_BASE + 'pdf.worker.min.js'; s.onload = res; s.onerror = () => rej(new Error('No se pudo cargar el motor de PDF')); document.head.appendChild(s); });
  return mainThread;
}
function withTimeout(p, ms){ return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('tiempo agotado')), ms))]); }
async function loadPdf(bytes){
  const open = () => { const task = pdfjsLib.getDocument({data: new Uint8Array(bytes.slice(0)), standardFontDataUrl: PDFJS_BASE + 'standard_fonts/', isEvalSupported:false}); return withTimeout(task.promise, 20000).catch(e => { try { task.destroy(); } catch(_){} throw e; }); };
  try { await withTimeout(initPdf(), 8000); if(!window.pdfjsWorker) return await open(); } catch(e){ console.warn('worker', e); }
  await useMainThread();
  return await open();
}

/* ---------- Render de páginas PDF ---------- */
const BASE_PX = 4.5e6;

  if(renderBusy || !E || !E.pdf) return;

  if(!vis.length) return;
  // 1) bases de las páginas visibles y vecinas
  const want = new Set(); vis.forEach(i => { for(let k=i-1;k<=i+1;k++) if(k>=0 && k<E.pages.length) want.add(k); });
  E.pages.forEach(p => { if(!want.has(p.i) && Math.abs(p.i - vis[0]) > 4){ p.base = null; p.tile = null; } });
  const need = [...want].find(i => !E.pages[i].base);
  const myE = E;
  renderBusy = true;
  try {
    if(need != null){
      const p = E.pages[need]; const s = Math.min(3, Math.sqrt(BASE_PX / (p.w * p.h)));
      const pg = await E.pdf.getPage(need+1); const vp = pg.getViewport({scale:s});
      const c = document.createElement('canvas'); c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
      const x = c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
      await pg.render({canvasContext:x, viewport:vp}).promise;
      if(E === myE){ p.base = {canvas:c, s}; requestDraw(); }
    } else if(!gesture && Date.now() - lastMove > 180){
      // 2) detalle nítido del área visible
      const S = Math.min(E.cam.z * dpr, 14);
      for(const i of vis.slice(0,2)){
        const p = E.pages[i]; if(!p.base || S <= p.base.s * 1.15) { p.tile = null; continue; }
        const rx = Math.max(0, E.cam.x - p.x), ry = Math.max(0, E.cam.y - p.y);
        const rx2 = Math.min(p.w, E.cam.x + W/E.cam.z - p.x), ry2 = Math.min(p.h, E.cam.y + H/E.cam.z - p.y);
        if(rx2 <= rx || ry2 <= ry) continue;
        const t = p.tile; if(t && Math.abs(t.S - S) < 0.01 && t.rx <= rx+0.5 && t.ry <= ry+0.5 && t.rx2 >= rx2-0.5 && t.ry2 >= ry2-0.5) continue;
        const camKey = JSON.stringify(E.cam);
        const pg = await E.pdf.getPage(i+1); const vp = pg.getViewport({scale:S});
        const c = document.createElement('canvas'); c.width = Math.ceil((rx2-rx)*S); c.height = Math.ceil((ry2-ry)*S);
        const x = c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
        await pg.render({canvasContext:x, viewport:vp, transform:[1,0,0,1,-rx*S,-ry*S]}).promise;
        if(E === myE && JSON.stringify(E.cam) === camKey){ p.tile = {canvas:c, S, rx, ry, rx2, ry2}; requestDraw(); }
        break;
      }
    }
  } catch(e){ console.warn(e); }

}

  const c = E.cam, y0 = c.y, y1 = c.y + H/c.z, x0 = c.x, x1 = c.x + W/c.z;

function openPenPop(anchor){

/* ---------- Deshacer ---------- */
function pushOp(op){ E.undo.push(op); E.redo.length = 0; changed(); }
function doOp(op){ applyOp(op, false); pushOp(op); }
function applyOp(op, inverse){
  if(op.k === 'add'){
    const L = E.ann.pages[op.pi][op.list];
    if(inverse){ const i = L.indexOf(op.item); if(i>=0) L.splice(i,1); } else L.push(op.item);
  } else if(op.k === 'del'){
    if(inverse) [...op.items].sort((a,b)=>a.idx-b.idx).forEach(it => E.ann.pages[it.pi][it.list].splice(it.idx, 0, it.item));
    else op.items.forEach(it => { const L = E.ann.pages[it.pi][it.list]; const i = L.indexOf(it.item); if(i>=0) L.splice(i,1); });
  } else if(op.k === 'scale'){
    (inverse ? op.before : op.after).forEach((s,i) => E.ann.pages[i].scale = s);
    updScaleTag();
  }
}
function undo(){ const op = E.undo.pop(); if(!op) return; applyOp(op, true); E.redo.push(op); changed(); }
function redo(){ const op = E.redo.pop(); if(!op) return; applyOp(op, false); E.undo.push(op); changed(); }
function updUndo(){ if(!E) return; $('#eUndo').disabled = !E.undo.length; $('#eRedo').disabled = !E.redo.length; }
$('#eUndo').onclick = () => undo(); $('#eRedo').onclick = () => redo();
document.addEventListener('keydown', e => {
  if(!E || e.target.closest('input,textarea')) return;
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); }
  else if(e.key === 'Escape') cancelDraft();
  else if(e.key === 'Enter' && E.mdraft) finishDraft();
});

/* ---------- Entrada: puntero ---------- */
const ptrs = new Map();
let gesture = null, lastMove = 0;
function pos(e){ const r = view.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
function toDoc(s){ return [E.cam.x + s[0]/E.cam.z, E.cam.y + s[1]/E.cam.z]; }
function pageAt(d, tol=0){ return E.pages.find(p => d[0] >= p.x - tol && d[0] <= p.x + p.w + tol && d[1] >= p.y - tol && d[1] <= p.y + p.h + tol); }
function startNav(){
  if(gesture && gesture.timer) clearTimeout(gesture.timer);
  const pts = [...ptrs.values()];
  if(!pts.length){ gesture = null; return; }
  const mid = pts.length > 1 ? [(pts[0].s[0]+pts[1].s[0])/2, (pts[0].s[1]+pts[1].s[1])/2] : pts[0].s;
  const dist = pts.length > 1 ? Math.hypot(pts[0].s[0]-pts[1].s[0], pts[0].s[1]-pts[1].s[1]) : 0;
  gesture = {mode:'nav', mid, dist, cam:{...E.cam}};
}
view.addEventListener('pointerdown', e => {
  if(!E) return;
  view.setPointerCapture(e.pointerId);
  const s = pos(e);
  ptrs.set(e.pointerId, {s, type:e.pointerType});
  if(e.pointerType === 'pen' && !prefs.penSeen){ prefs.penSeen = true; prefs.penOnly = true; savePrefs(); toast('Lápiz detectado: ahora el dedo mueve el plano y el lápiz escribe'); }
  const touchNav = e.pointerType === 'touch' && (prefs.penOnly || ptrs.size > 1);
  if(gesture && gesture.mode === 'draw' && ptrs.size > 1 && gesture.type === 'touch'){ abortDraw(); }
  if(gesture && gesture.mode === 'draw') return;
  if(E.tool === 'hand' || touchNav || e.button === 1 || (gesture && gesture.mode === 'nav')){ startNav(); return; }
  if(['len','poly','area','cal'].includes(E.tool) && e.pointerType === 'touch'){
    // tocar = punto · arrastrar = mover · mantener = afinar con lupa
    const pend = {mode:'pending', id:e.pointerId, s, ev:e};
    pend.timer = setTimeout(() => { if(gesture === pend){ gesture = null; startDraw(pend.ev, ptrs.get(pend.id) ? ptrs.get(pend.id).s : pend.s); requestDraw(); } }, 260);
    gesture = pend; return;
  }
  startDraw(e, s);
});
view.addEventListener('pointermove', e => {
  if(!E) return;
  const s = pos(e);
  const pp = ptrs.get(e.pointerId);
  if(!pp){
    if(E.mdraft && (e.pointerType === 'mouse' || e.pointerType === 'pen')){
      const d = toDoc(s), p = E.pages[E.mdraft.pi]; E.mdraft.cursor = [d[0]-p.x, d[1]-p.y]; requestDraw();
    }
    return;
  }
  pp.s = s; lastMove = Date.now();
  if(!gesture) return;
  if(gesture.mode === 'pending'){
    if(gesture.id === e.pointerId && Math.hypot(s[0]-gesture.s[0], s[1]-gesture.s[1]) > 10){ startNav(); gesture.mid = gesture.mid; }
    return;
  }
  if(gesture.mode === 'nav'){
    const pts = [...ptrs.values()]; const c = E.cam, g = gesture;
    if(pts.length > 1 && g.dist > 0){
      const mid = [(pts[0].s[0]+pts[1].s[0])/2, (pts[0].s[1]+pts[1].s[1])/2];
      const dist = Math.hypot(pts[0].s[0]-pts[1].s[0], pts[0].s[1]-pts[1].s[1]);
      const z = Math.min(40, Math.max(0.05, g.cam.z * dist / g.dist));
      const dm = [g.cam.x + g.mid[0]/g.cam.z, g.cam.y + g.mid[1]/g.cam.z];
      c.z = z; c.x = dm[0] - mid[0]/z; c.y = dm[1] - mid[1]/z;
    } else {
      c.x = g.cam.x - (s[0]-g.mid[0])/c.z; c.y = g.cam.y - (s[1]-g.mid[1])/c.z;
    }
    clampCam(); requestDraw();
  } else if(gesture.mode === 'draw' && gesture.id === e.pointerId){
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    moveDraw(evs.length ? evs : [e]);
  }
});
function endPointer(e){
  if(!E) return;
  const had = ptrs.delete(e.pointerId);
  if(!had) return;
  if(gesture && gesture.mode === 'pending' && gesture.id === e.pointerId){
    clearTimeout(gesture.timer); gesture = null;
    if(e.type === 'pointercancel') return;
    startDraw(e, pos(e));
    if(gesture && gesture.mode === 'draw'){ endDraw(e, false); gesture = null; }
    return;
  }
  if(gesture && gesture.mode === 'draw' && gesture.id === e.pointerId){ endDraw(e, e.type === 'pointercancel'); gesture = null; }
  else if(gesture && gesture.mode === 'nav'){ ptrs.size ? startNav() : (gesture = null); lastMove = Date.now(); setTimeout(requestDraw, 200); }
}
view.addEventListener('pointerup', endPointer);
view.addEventListener('pointercancel', endPointer);
view.addEventListener('wheel', e => {
  if(!E) return; e.preventDefault();
  const c = E.cam;
  if(e.ctrlKey || e.metaKey){
    const s = pos(e), d = toDoc(s), z = Math.min(40, Math.max(0.05, c.z * Math.exp(-e.deltaY * 0.0025)));
    c.z = z; c.x = d[0] - s[0]/z; c.y = d[1] - s[1]/z;
  } else { c.x += e.deltaX / c.z; c.y += e.deltaY / c.z; }
  clampCam(); lastMove = Date.now(); requestDraw(); setTimeout(requestDraw, 220);
}, {passive:false});

function local(pi, s){ const d = toDoc(s), p = E.pages[pi]; return [d[0]-p.x, d[1]-p.y]; }
function startDraw(e, s){
  const d = toDoc(s), t = E.tool;
  const isMeasure = ['len','poly','area','cal'].includes(t);
  let page = pageAt(d, isMeasure ? 0 : 0);
  if(isMeasure && E.mdraft) page = E.pages[E.mdraft.pi];
  if(!page){ startNav(); return; }
  gesture = {mode:'draw', id:e.pointerId, type:e.pointerType, pi:page.i, t, start:s};
  const L = local(page.i, s);
  if(t === 'pen' || t === 'hl'){
    const pt = prefs[t]; const pr = e.pointerType === 'pen' ? (e.pressure || 0.5) : 0.5;
    const st = {t, c:pt.c, w: +(pt.w / E.cam.z).toFixed(3), u: e.pointerType !== 'pen', p:[+L[0].toFixed(2), +L[1].toFixed(2), +pr.toFixed(2)]};
    E.ann.pages[page.i].strokes.push(st); gesture.item = st; requestDraw();
  } else if(t === 'eraser'){
    gesture.removed = []; eraseAt(page.i, L);
  } else if(isMeasure){
    if(!E.mdraft) E.mdraft = {k:t, pi:page.i, p:[]};
    E.mdraft.cursor = L; loupeAt = s; requestDraw();
  }
}
function moveDraw(evs){
  const g = gesture;
  for(const ev of evs){
    const s = pos(ev), L = local(g.pi, s);
    if(g.t === 'pen' || g.t === 'hl'){
      const P = g.item.p, lx = P[P.length-3], ly = P[P.length-2];
      if(Math.hypot(L[0]-lx, L[1]-ly) * E.cam.z < 1.2) continue;
      const pr = ev.pointerType === 'pen' ? (ev.pressure || 0.5) : 0.5;
      P.push(+L[0].toFixed(2), +L[1].toFixed(2), +pr.toFixed(2));
    } else if(g.t === 'eraser'){
      const d = toDoc(s), pg = pageAt(d); if(pg) eraseAt(pg.i, [d[0]-pg.x, d[1]-pg.y]);
    } else if(E.mdraft){
      E.mdraft.cursor = L; loupeAt = s;
    }
  }
  requestDraw();
}
function abortDraw(){
  const g = gesture; if(!g) return;
  if(g.item){ const L = E.ann.pages[g.pi].strokes; const i = L.indexOf(g.item); if(i>=0) L.splice(i,1); }
  if(g.removed && g.removed.length){ applyOp({k:'del', items:g.removed}, true); }
  if(E.mdraft && !E.mdraft.p.length) E.mdraft = null; else if(E.mdraft) E.mdraft.cursor = null;
  loupeAt = null; gesture = null; requestDraw();
}
async function endDraw(e, cancelled){
  const g = gesture; loupeAt = null;
  if(cancelled){ abortDraw(); return; }
  if(g.t === 'pen' || g.t === 'hl'){ pushOp({k:'add', pi:g.pi, list:'strokes', item:g.item}); }
  else if(g.t === 'eraser'){ if(g.removed.length) pushOp({k:'del', items:g.removed}); }
  else if(g.t === 'text'){
    const s = pos(e); if(Math.hypot(s[0]-g.start[0], s[1]-g.start[1]) > 12) return;
    const L = local(g.pi, s); const pt = prefs.text;
    const txt = await askText('Texto', '', {label:'Añadir', multiline:true});
    if(txt && txt.trim()){ const size = +(pt.w / E.cam.z).toFixed(2); doOp({k:'add', pi:g.pi, list:'texts', item:{x:+L[0].toFixed(2), y:+(L[1]-size*0.6).toFixed(2), s:size, c:pt.c, txt:txt.replace(/\s+$/,'')}}); }
  }
  else if(E.mdraft){
    const d = E.mdraft, L = local(d.pi, pos(e));
    // cerrar área tocando el primer punto
    if(d.k === 'area' && d.p.length >= 3){ const f = d.p[0]; if(Math.hypot(L[0]-f[0], L[1]-f[1]) * E.cam.z < 16){ finishDraft(); return; } }
    d.p.push([+L[0].toFixed(2), +L[1].toFixed(2)]);
    d.cursor = e.pointerType === 'touch' ? null : L;
    if((d.k === 'len' || d.k === 'cal') && d.p.length === 2) finishDraft();
    else updMbar();
  }
  requestDraw();
}
function eraseAt(pi, L){
  const pg = E.ann.pages[pi], r = 10 / E.cam.z, g = gesture;
  const hitSeg = (P, step, rad) => { for(let i=0;i<P.length;i+=step){ const j = i+step < P.length ? i+step : i; if(segDist(L, [P[i],P[i+1]], [P[j],P[j+1]]) <= rad) return true; } return false; };
  const del = (list, item) => { const idx = pg[list].indexOf(item); if(idx<0) return; pg[list].splice(idx,1); g.removed.push({pi, list, item, idx}); };
  [...pg.strokes].forEach(s => { if(hitSeg(s.p, 3, r + s.w/2)) del('strokes', s); });
  [...pg.measures].forEach(m => { const flat = m.p.flat(); const P2 = m.k==='area' ? flat.concat(m.p[0]) : flat; if(hitSeg(P2, 2, r)) del('measures', m); });
  [...pg.texts].forEach(t => { ctx.font = `${t.s}px system-ui`; const lines = t.txt.split('\n'); const w = Math.max(...lines.map(l=>ctx.measureText(l).width)); if(L[0] >= t.x - r && L[0] <= t.x + w + r && L[1] >= t.y - r && L[1] <= t.y + lines.length*t.s*1.25 + r) del('texts', t); });
  requestDraw();
}
function segDist(p, a, b){
  const dx=b[0]-a[0], dy=b[1]-a[1], l2 = dx*dx+dy*dy;
  let t = l2 ? ((p[0]-a[0])*dx + (p[1]-a[1])*dy) / l2 : 0; t = Math.max(0, Math.min(1, t));
  return Math.hypot(p[0]-a[0]-t*dx, p[1]-a[1]-t*dy);
}

/* ---------- Medición ---------- */
function updMbar(){
  const d = E.mdraft, bar = $('#mbar');
  if(!d || !d.p.length || d.k === 'len' || d.k === 'cal'){ bar.hidden = true; return; }
  bar.hidden = false;
  $('#mbarTx').textContent = (d.k === 'area' ? 'Área' : 'Recorrido') + ' · ' + d.p.length + (d.p.length===1?' punto':' puntos');

function cancelDraft(){ if(!E) return; E.mdraft = null; loupeAt = null; $('#mbar').hidden = true; requestDraw(); }
function finishDraft(){

  const m = {id:uid(), k:d.k, p:d.p};

$('#mDone').onclick = finishDraft;

$('#mUndoPt').onclick = () => { const d = E.mdraft; if(!d) return; d.p.pop(); if(!d.p.length) cancelDraft(); else { updMbar(); requestDraw(); } };

function currentPage(){ const v = visiblePages(); if(!v.length) return 0; const c = E.cam, mid = c.y + H/c.z/2; return v.reduce((best,i) => { const p=E.pages[i]; return (mid>=p.y && mid<=p.y+p.h) ? i : best; }, v[0]); }

async function calibrate(d){

        const val = v == null ? 'sin escala' : nf(v) + (m.k==='area' ? ' m²' : ' m');
        const del = h('button',{class:'ib', title:'Borrar', onclick:() => { const L = E.ann.pages[pi].measures; const idx = L.indexOf(m); L.splice(idx,1); pushOp({k:'del', items:[{pi, list:'measures', item:m, idx}]}); li.remove(); }}, svgIcon('i-trash'));
        const li = h('li',{}, h('span',{class:'dot', style:'background:' + MCOL[m.k]}),
          h('button',{class:'tx', onclick:() => { close(); goTo(m, pi); }}, h('b',{}, val), h('span',{}, MNAME[m.k] + ' · pág. ' + (pi+1) + ' · nº ' + (k+1))), del);
        ul.append(li);
      });
      sh.append(ul);
    }
    sh.append(acts(
      rows.length ? h('button',{class:'btn', onclick:async () => {
        close();
        if(!(await confirmSheet('Borrar todas las medidas', 'Se borrarán las ' + rows.length + ' medidas de esta nota. Podrás recuperarlas con deshacer.', 'Borrar todas'))) return;
        const items = [];
        E.ann.pages.forEach((pg, pi) => pg.measures.forEach((m, idx) => items.push({pi, list:'measures', item:m, idx})));
        E.ann.pages.forEach(pg => pg.measures.length = 0);
        pushOp({k:'del', items}); toast('Medidas borradas');
      }}, 'Borrar todas') : null,
      rows.length ? h('button',{class:'btn', onclick:async () => {
        const txt = ['Nº\tTipo\tPágina\tValor\tUnidad'].concat(rows.map(({m,pi,v},k) => [k+1, MNAME[m.k], pi+1, v==null?'':nf(v), m.k==='area'?'m²':'m'].join('\t'))).join('\n');
        try { await navigator.clipboard.writeText(txt); toast('Medidas copiadas: pégalas en Excel'); } catch(e){ toast('No se pudo copiar'); }
      }}, 'Copiar para Excel') : null,
      h('button',{class:'btn pri', onclick:() => close()}, 'Cerrar')));
  });
};
function goTo(m, pi){
  const p = E.pages[pi], a = labelAnchor(m);
  E.cam.x = p.x + a[0] - W/2/E.cam.z; E.cam.y = p.y + a[1] - H/2/E.cam.z; clampCam(); requestDraw();
}

/* ---------- Menú más ---------- */
$('#eMore').onclick = () => {

      h('button',{onclick:async () => { close(); const t = await askText('Renombrar', E.meta.title); if(t && t.trim()){ E.meta.title = t.trim(); $('#eTitle').textContent = E.meta.title; changed(); } }}, svgIcon('i-text'), 'Renombrar')));
  });
};
$('#eTitle').onclick = async () => { const t = await askText('Renombrar', E.meta.title); if(t && t.trim()){ E.meta.title = t.trim(); $('#eTitle').textContent = E.meta.title; changed(); } };
function addPage(){
  E.meta.pages.push({w:595.28, h:841.89, blank:true});
  E.ann.pages.push({strokes:[], texts:[], measures:[], scale:null});
  const keep = E.pages.map(p => p.base);
  layoutPages(); keep.forEach((b,i) => { E.pages[i].base = b; });
  const p = E.pages.at(-1); E.cam.y = p.y - 12/E.cam.z; clampCam(); changed(); toast('Página añadida');
}
$('#tFit').onclick = () => fitWidth();
$('#eBack').onclick = () => closeEditor();

/* ---------- Exportar PDF ---------- */
$('#eExport').onclick = async () => {
  const done = busy('Generando PDF…');
  try {
    const bytes = await buildPdf();
    const name = E.meta.title.replace(/[\\/:*?"<>|]+/g,'_') + ' (anotado).pdf';
    done(); await deliver(name, bytes);
  } catch(e){ done(); console.error(e); toast('No se pudo exportar: ' + (e.message || e)); }
};
async function deliver(name, bytes){
  const blob = new Blob([bytes], {type:'application/pdf'});
  try {
    if(window.claude && window.claude.use){
      const dl = await window.claude.use('downloads');
      if(dl){ try { await dl.save({filename:name, data:blob}); toast('PDF guardado'); return; } catch(err){ if(err && err.code === 'declined') return; } }
    }
  } catch(e){}
  try {
    const f = new File([blob], name, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], title:name}); return; }
  } catch(e){ if(e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 30000);
}
function hexRgb(hx){ const n = parseInt(hx.slice(1), 16); return PDFLib.rgb(((n>>16)&255)/255, ((n>>8)&255)/255, (n&255)/255); }
async function buildPdf(){
  const {PDFDocument, StandardFonts, LineCapStyle, BlendMode, degrees} = PDFLib;
  let doc;
  const srcCount = E.meta.kind === 'pdf' ? E.pdf.numPages : 0;
  if(E.meta.kind === 'pdf'){ const bytes = await DB.get('pdfs', E.meta.id); doc = await PDFDocument.load(bytes.slice(0), {ignoreEncryption:true}); }
  else doc = await PDFDocument.create();
  for(let i = srcCount; i < E.meta.pages.length; i++) doc.addPage([E.meta.pages[i].w, E.meta.pages[i].h]);
  const font = await doc.embedFont(StandardFonts.Helvetica), fontB = await doc.embedFont(StandardFonts.HelveticaBold);
  const safe = (f, s) => { try { f.encodeText(s); return s; } catch(e){ return [...s].map(ch => { try { f.encodeText(ch); return ch; } catch(_){ return '?'; } }).join(''); } };
  for(let i = 0; i < E.meta.pages.length; i++){
    const pg = doc.getPage(i), A = E.ann.pages[i];
    let conv;
    if(i < srcCount){ const vp = (await E.pdf.getPage(i+1)).getViewport({scale:1}); conv = (x,y) => vp.convertToPdfPoint(x,y); }
    else { const hgt = E.meta.pages[i].h; conv = (x,y) => [x, hgt - y]; }
    const o = conv(0,0), ux = conv(1,0); const ang = Math.atan2(ux[1]-o[1], ux[0]-o[0]) * 180 / Math.PI;
    const path = pts => pts.map((q,k) => { const r = conv(q[0], q[1]); return (k?'L':'M') + r[0].toFixed(2) + ' ' + (-r[1]).toFixed(2); }).join(' ');
    for(const s of A.strokes){
      const pts = []; for(let k=0;k<s.p.length;k+=3) pts.push([s.p[k], s.p[k+1]]);
      if(pts.length === 1) pts.push([pts[0][0]+0.05, pts[0][1]]);
      let w = s.w; if(!s.u && s.t !== 'hl'){ let sum=0, n=0; for(let k=2;k<s.p.length;k+=3){ sum += 0.35 + 1.3*s.p[k]; n++; } w = s.w * sum / n; }
      pg.drawSvgPath(path(pts), {x:0, y:0, borderColor:hexRgb(s.c), borderWidth:w, borderLineCap:LineCapStyle.Round, borderOpacity: s.t==='hl' ? 0.45 : 1, blendMode: s.t==='hl' ? BlendMode.Multiply : undefined});
    }
    for(const t of A.texts){
      t.txt.split('\n').forEach((ln, k) => { const r = conv(t.x, t.y + t.s*0.82 + k*t.s*1.25); pg.drawText(safe(font, ln), {x:r[0], y:r[1], size:t.s, font, color:hexRgb(t.c), rotate:degrees(ang)}); });
    }
    for(const m of A.measures){
      const col = hexRgb(MCOL[m.k]);
      const sc = Math.max(E.meta.pages[i].w, E.meta.pages[i].h) / 842;   // grosor proporcional al tamaño del plano
      if(m.k === 'area' && m.p.length > 2) pg.drawSvgPath(path(m.p) + ' Z', {x:0, y:0, color:col, opacity:0.16, borderWidth:0});
      pg.drawSvgPath(path(m.k==='area' ? m.p.concat([m.p[0]]) : m.p), {x:0, y:0, borderColor:col, borderWidth:1.1*sc, borderLineCap:LineCapStyle.Round});
      const txt = safe(fontB, measureText(m, i).replace('Σ ', 'Total ')); if(!txt) continue;
      const a = labelAnchor(m), size = 7.5*sc, tw = fontB.widthOfTextAtSize(txt, size);
      const r0 = conv(a[0] - tw/2 - 3*sc, a[1] + size*0.5 + 2*sc - (m.k==='area'?0:8*sc));
      pg.drawRectangle({x:r0[0], y:r0[1], width:tw + 6*sc, height:size + 4*sc, color:PDFLib.rgb(1,1,1), borderColor:col, borderWidth:0.8*sc, rotate:degrees(ang)});
      const r1 = conv(a[0] - tw/2, a[1] + size*0.5 - 0.3*sc - (m.k==='area'?0:8*sc));
      pg.drawText(txt, {x:r1[0], y:r1[1], size, font:fontB, color:PDFLib.rgb(.11,.12,.15), rotate:degrees(ang)});
    }
  }
  return await doc.save();
}

/* ---------- Arranque ---------- */
window.__notas = { get E(){ return E; } };
// Actualiza la etiqueta de escala al moverse por el documento
let lastTagPage = -1;
setInterval(() => { if(E){ const p = currentPage(); if(p !== lastTagPage){ lastTagPage = p; updScaleTag(); } } }, 300);
(async () => { await DB.open(); refreshLib(); initPdf().catch(()=>{}); })();
if('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
// Pedir almacenamiento persistente para que el sistema no borre las notas
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
})();
