<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Notas de obra</title>
<meta name="theme-color" content="#1f2a44">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#f3f1ec; --surface:#ffffff; --surface2:#f8f7f4; --ink:#1c1f26; --muted:#6b6f78; --line:#e2dfd8;
  --accent:#d9480f; --accent-ink:#ffffff; --desk:#d9d6cf; --shadow:0 1px 2px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.06);
  --sel:#fde8dc;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181d; --surface:#1f2228; --surface2:#262a31; --ink:#eceae5; --muted:#9a9ea7; --line:#33373f;
    --accent:#ff7a3d; --accent-ink:#1a0c04; --desk:#0f1114; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
    --sel:#3a2418;
  }
}
:root[data-theme="dark"]{
  --bg:#16181d; --surface:#1f2228; --surface2:#262a31; --ink:#eceae5; --muted:#9a9ea7; --line:#33373f;
  --accent:#ff7a3d; --accent-ink:#1a0c04; --desk:#0f1114; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  --sel:#3a2418;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
[hidden]{display:none!important}

/* Biblioteca */
#lib{height:100%;overflow:auto;padding:0 16px calc(24px + env(safe-area-inset-bottom))}
.lhead{padding:calc(14px + env(safe-area-inset-top)) 0 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.lhead h1{font-size:22px;margin:0;flex:1 1 100%;letter-spacing:-.01em}
.lhead .btn{flex:1;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);font-weight:600;font-size:14px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn svg.i{width:18px;height:18px}
.search{width:100%;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:6px}
.card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;text-align:left}
.card .th{aspect-ratio:4/3;background:var(--surface2) center/contain no-repeat;border-bottom:1px solid var(--line)}
.card .meta{display:flex;align-items:center;gap:4px;padding:8px 6px 8px 10px}
.card .t{flex:1;min-width:0}
.card .t b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:13.5px;overflow:hidden;word-break:break-word;line-height:1.25}
.card .t span{font-size:12px;color:var(--muted)}
.card .more{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.empty{margin:60px auto;max-width:340px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.foot{margin-top:24px;font-size:12px;color:var(--muted);text-align:center}

.obras{display:flex;gap:8px;overflow-x:auto;width:100%;scrollbar-width:none;padding:2px 0}
.obras::-webkit-scrollbar,.frow::-webkit-scrollbar,.strip::-webkit-scrollbar{display:none}
.obras .chip{flex:none;white-space:nowrap}
.chip.add{border-style:dashed;background:transparent}
#filters{display:flex;flex-direction:column;gap:6px;margin:0 0 6px}
.frow{display:flex;align-items:center;gap:6px}
.fchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.fchips::-webkit-scrollbar{display:none}
.frow .fl{font-size:12px;color:var(--muted);flex:none;width:68px}
.fchips .chip{flex:none;height:32px;font-size:13px;white-space:nowrap}
.sect{font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 6px}
.strip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.card.sm{flex:none;width:120px}
.card.sm .th{aspect-ratio:4/3}
.card.sm .meta{padding:6px 8px}
.card.sm .t b{font-size:12px}
.card.sm .t span{font-size:11px}
.lhead #bDalux{flex:0 0 auto}
/* Editor */
#ed{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--desk)}
.ebar{display:flex;align-items:center;gap:2px;padding:calc(6px + env(safe-area-inset-top)) 6px 4px;background:var(--surface);border-bottom:1px solid var(--line)}
.ebar .title{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px;text-align:left;height:40px}
.ib{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;position:relative}
.ib:disabled{opacity:.35}
.ib.on{background:var(--sel);color:var(--accent)}
.tools{display:flex;align-items:center;gap:2px;padding:4px 6px 6px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.sep{width:1px;height:26px;background:var(--line);margin:0 4px;flex:none}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1.5px var(--line)}
.ib small{position:absolute;bottom:1px;left:0;right:0;font-size:9px;text-align:center;color:var(--muted);font-weight:600}
#host{position:relative;flex:1;overflow:hidden}
#view{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#loupe{position:absolute;width:128px;height:128px;border-radius:50%;box-shadow:0 0 0 2px var(--surface),0 4px 18px rgba(0,0,0,.35);pointer-events:none}
.mbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:6px;align-items:center;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:6px 6px 6px 12px;max-width:calc(100% - 24px)}
.mbar span{font-size:13px;font-weight:600;white-space:nowrap;margin-right:4px}
.mbar .btn{height:36px;box-shadow:none;background:var(--surface2);padding:0 10px}
.mbar .btn.pri{background:var(--accent)}
.zoomtag{position:absolute;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));font-size:12px;background:var(--surface);color:var(--muted);padding:3px 8px;border-radius:8px;box-shadow:var(--shadow);pointer-events:none}
.scaletag{position:absolute;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));font-size:12px;background:var(--surface);padding:3px 8px;border-radius:8px;box-shadow:var(--shadow)}
.scaletag.no{color:var(--accent);font-weight:600}

/* Popover y hojas */
.pop{position:fixed;z-index:20;background:var(--surface);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.25);padding:12px;width:min(300px,calc(100vw - 24px))}
.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-bottom:12px}
.pal button{aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 1.5px var(--line)}
.pal button.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.pop label{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.pop input[type=range]{flex:1;accent-color:var(--accent)}
.prev{height:36px;display:grid;place-items:center;margin-top:6px}
.scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheet h2{font-size:18px;margin:0 0 10px}
.sheet p{margin:0 0 12px;color:var(--muted);font-size:13px}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.sheet .acts .btn{box-shadow:none;background:var(--surface2)}
.sheet .acts .btn.pri{background:var(--accent)}
.sheet .acts .btn.danger{background:#c92a2a;color:#fff}
.field{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);padding:0 12px;font:inherit;font-size:16px}
textarea.field{height:110px;padding:10px 12px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.chip{height:36px;padding:0 12px;border-radius:18px;background:var(--surface2);border:1px solid var(--line);font-weight:600;font-size:14px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{display:flex;align-items:center;gap:8px;margin:8px 0}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin:10px 0}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.mlist{list-style:none;margin:0;padding:0}
.mlist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.mlist .dot{width:10px;height:10px;border-radius:50%;flex:none}
.mlist .tx{flex:1;min-width:0;text-align:left}
.mlist .tx b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.mlist .tx span{font-size:12px;color:var(--muted)}
.tot{display:flex;gap:10px;margin-bottom:6px}
.tot div{flex:1;background:var(--surface2);border-radius:12px;padding:10px 12px}
.tot span{display:block;font-size:12px;color:var(--muted)}
.tot b{font-size:18px;font-variant-numeric:tabular-nums}
.menu{display:flex;flex-direction:column}
.menu button{display:flex;align-items:center;gap:12px;padding:12px 4px;text-align:left;border-bottom:1px solid var(--line)}
.menu button:last-child{border-bottom:0}
.menu .sw2{margin-left:auto;width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none}
.menu .sw2::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.menu .sw2.on{background:var(--accent)}
.menu .sw2.on::after{left:21px}
.autobox{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px;margin:4px 0 10px;font-size:13px;color:var(--muted)}
.autobox.none{color:var(--muted)}
.autores{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.autores div{flex:1}.autores span{display:block;font-size:12px}.autores b{font-size:24px;color:var(--ink)}
.why{margin-top:4px;line-height:1.35}
.chip.sm{height:30px;font-size:13px;padding:0 10px;margin:4px 4px 0 0}
.btn.wide{width:100%;justify-content:center;box-shadow:none;background:var(--surface2);border:1px solid var(--line)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.photo{display:block;width:100%;max-height:55vh;object-fit:contain;border-radius:12px;background:#000;margin-bottom:8px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pcell{aspect-ratio:1;border-radius:10px;background:var(--surface2) center/cover no-repeat;position:relative}
.pcell span{position:absolute;left:6px;top:6px;background:#1f2a44;color:#fff;font-weight:700;font-size:12px;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 5px}
.srcbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.srcbtns .btn{height:56px;justify-content:center;box-shadow:none;background:var(--surface2);border:1px solid var(--line)}
.linkbtn{color:var(--accent);font-weight:600;font-size:13px;margin-top:6px;text-decoration:underline}
.card.arch .th{opacity:.45;position:relative}
.card .badge{position:absolute;left:8px;top:8px;background:#1c1f26;color:#fff;font-size:11px;font-weight:700;padding:3px 7px;border-radius:7px}
.card{position:relative}
.spacebar{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden;margin:6px 0 4px}
.spacebar i{display:block;height:100%;background:var(--accent)}
.selrow{display:flex;justify-content:flex-end;margin:4px 0 -2px}
.selrow .linkbtn{font-size:14px;font-weight:600;color:var(--accent);padding:6px 2px}
.card .ck{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.28);box-shadow:0 1px 4px rgba(0,0,0,.3);display:grid;place-items:center;color:#fff;font-size:15px;font-weight:800;z-index:2}
.card.sel{outline:3px solid var(--accent);outline-offset:-3px}
.card.sel .ck{background:var(--accent);border-color:var(--accent)}
body.selmode #lib{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
#selBar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);box-shadow:0 -4px 18px rgba(0,0,0,.15);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#selBar .cnt{flex:1 1 100%;display:flex;align-items:center;gap:10px;font-weight:700}
#selBar .cnt .linkbtn{margin-left:auto;font-weight:600;color:var(--accent);font-size:14px}
#selBar .btn{flex:1;justify-content:center;box-shadow:none;background:var(--surface2);padding:0 8px}
#selBar .btn.danger{background:#c92a2a;color:#fff}
#selBar .btn:disabled{opacity:.4}
#updBar{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:50;background:#1c1f26;color:#fff;border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.35);font-weight:600;font-size:14px}
#updBar span{flex:1}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1c1f26;color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;z-index:40;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.3)}
.busy{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(0,0,0,.25);color:#fff;font-weight:600}
.busy div{background:#1c1f26;padding:14px 18px;border-radius:14px}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></symbol>
    <symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 013 0V12M11 11V4.5a1.5 1.5 0 013 0V12M14 11.5V6a1.5 1.5 0 013 0v7c0 4.5-2.5 8-7 8-3 0-4.5-1.5-6-4l-1.6-3a1.5 1.5 0 012.5-1.6L8 15"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 013 3L8 19l-4 1z"/><path d="M14.5 6.5l3 3"/></symbol>
    <symbol id="i-hl" viewBox="0 0 24 24"><path d="M9 15l-3 3v2h5l2-3"/><path d="M9 15l7.5-11 4 3L13 17z"/><path d="M4 21h16" opacity=".5"/></symbol>
    <symbol id="i-eraser" viewBox="0 0 24 24"><path d="M7 20h13"/><path d="M4.5 15.5l9-9a2 2 0 012.8 0l3.2 3.2a2 2 0 010 2.8L12 20H8.5l-4-4z"/><path d="M9 11l5 5"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></symbol>
    <symbol id="i-len" viewBox="0 0 24 24"><path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></symbol>
    <symbol id="i-poly" viewBox="0 0 24 24"><circle cx="4" cy="18" r="1.8"/><circle cx="10" cy="7" r="1.8"/><circle cx="15" cy="15" r="1.8"/><circle cx="20" cy="5" r="1.8"/><path d="M5 16.4L9 8.6M11.2 8.6l2.6 4.8M16 13.4l3-6.8"/></symbol>
    <symbol id="i-area" viewBox="0 0 24 24"><path d="M4 7l7-3 9 5-3 11H6z" fill="currentColor" fill-opacity=".15"/></symbol>
    <symbol id="i-scale" viewBox="0 0 24 24"><path d="M3 8h18v8H3z"/><path d="M7 8v3M11 8v4M15 8v3M19 8v4"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01" stroke-width="3"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 002 2h10a2 2 0 002-2v-6"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><path d="M12 5h.01M12 12h.01M12 19h.01" stroke-width="3.2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-pdf" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/><path d="M12 11v6M9 14l3 3 3-3"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="i-cam" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1z"/><circle cx="12" cy="13.5" r="3.5"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
  </defs>
</svg>

<!-- Biblioteca -->
<main id="lib">
  <div class="lhead">
    <h1>Notas de obra</h1>
    <div class="obras" id="obras"></div>
    <button class="btn" id="bDalux" hidden style="display:none"></button>
    <button class="btn" id="bBlank"><svg class="i"><use href="#i-plus"/></svg>En blanco</button>
    <button class="btn pri" id="bImport"><svg class="i"><use href="#i-pdf"/></svg>Importar</button>
    <input type="file" id="file" multiple accept="application/pdf,.pdf,application/zip,.zip" hidden>
    <input type="file" id="dirIn" webkitdirectory multiple hidden>
    <input class="search" id="q" placeholder="Buscar plano o código" type="search">
  </div>
  <div id="filters"></div>
  <div class="selrow" id="selRow"><button class="linkbtn" id="bSel">Seleccionar</button></div>
  <div id="recent"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden><b>Aún no hay planos</b>Crea una obra con «+ Obra» e importa sus planos en PDF (puedes seleccionar muchos a la vez). Se clasifican solos por zona e instalación según el nombre del archivo.</div>
  <div class="foot">Las notas se guardan en este dispositivo.<br><button class="linkbtn" id="bSpace">Espacio ocupado…</button><br><button class="linkbtn" id="bVer" style="margin-top:6px">Buscar actualización</button></div>
  <input type="file" id="reIn" accept="application/pdf,.pdf" hidden>
  <div id="selBar" hidden>
    <div class="cnt"><button class="linkbtn" id="sCancel" style="margin-left:0;color:var(--ink)">✕</button><span id="sCount">0 seleccionados</span><button class="linkbtn" id="sAll">Seleccionar todos</button></div>
    <button class="btn" id="sMove"><svg class="i"><use href="#i-share"/></svg>Mover</button>
    <button class="btn" id="sArch"><svg class="i"><use href="#i-pdf"/></svg>Archivar</button>
    <button class="btn danger" id="sDel"><svg class="i"><use href="#i-trash"/></svg>Eliminar</button>
  </div>
</main>

<!-- Editor -->
<section id="ed" hidden>
  <div class="ebar">
    <button class="ib" id="eBack" title="Volver"><svg class="i"><use href="#i-back"/></svg></button>
    <button class="title" id="eTitle"></button>
    <button class="ib" id="eUndo" title="Deshacer"><svg class="i"><use href="#i-undo"/></svg></button>
    <button class="ib" id="eRedo" title="Rehacer"><svg class="i"><use href="#i-redo"/></svg></button>
    <button class="ib" id="eList" title="Medidas"><svg class="i"><use href="#i-list"/></svg></button>

<script>
(() => {
'use strict';
const PDFJS_BASE = 'lib/';
const $ = s => document.querySelector(s);
const PT_MM = 25.4 / 72;
const COLORS = ['#1c1f26','#e03131','#1971c2','#2f9e44','#f08c00','#9c36b5','#868e96','#ffffff'];
const HL_COLORS = ['#ffd43b','#69db7c','#74c0fc','#ffa8a8','#e599f7','#ffc078','#ced4da','#63e6be'];
const MCOL = {len:'#d9480f', poly:'#1971c2', area:'#2f9e44', cal:'#9c36b5'};
const MNAME = {len:'Longitud', poly:'Recorrido', area:'Área'};
const nf = (v, d=2) => v.toLocaleString('es-ES',{minimumFractionDigits:d, maximumFractionDigits:d});
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

/* ---------- Preferencias (por dispositivo) ---------- */
const prefs = Object.assign({
  pen:{c:'#1c1f26', w:2.2}, hl:{c:'#ffd43b', w:18}, text:{c:'#1c1f26', w:16}, penOnly:false
}, (() => { try { return JSON.parse(localStorage.getItem('notasObra.prefs') || '{}'); } catch(e){ return {}; } })());
const savePrefs = () => { try { localStorage.setItem('notasObra.prefs', JSON.stringify(prefs)); } catch(e){} };

/* ---------- Almacenamiento: IndexedDB con respaldo en memoria ---------- */
const DB = {
  db:null, mem:{notes:new Map(), pdfs:new Map(), ann:new Map(), photos:new Map(), handles:new Map()},
  async open(){
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('notasObra', 3);
        r.onupgradeneeded = () => { const d = r.result; ['notes','pdfs','ann','photos','handles'].forEach(s => { if(!d.objectStoreNames.contains(s)) d.createObjectStore(s); }); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
        setTimeout(() => rej(new Error('IndexedDB no responde')), 4000);
      });
    } catch(e){ this.db = null; }
  },
  _req(store, mode, fn){
    return new Promise((res, rej) => { const t = this.db.transaction(store, mode); const r = fn(t.objectStore(store)); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
  },
  async get(s,k){ if(this.db) try { return await this._req(s,'readonly',o=>o.get(k)); } catch(e){} return this.mem[s].get(k); },
  async put(s,k,v){ this.mem[s].set(k,v); if(this.db) try { await this._req(s,'readwrite',o=>o.put(v,k)); } catch(e){ console.warn(e); } },
  async del(s,k){ this.mem[s].delete(k); if(this.db) try { await this._req(s,'readwrite',o=>o.delete(k)); } catch(e){} },
  async all(s){ if(this.db) try { return await this._req(s,'readonly',o=>o.getAll()); } catch(e){} return [...this.mem[s].values()]; }
};

/* ---------- UI genérica ---------- */
let toastT;
function toast(msg, ms=2600){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, ms); }
function busy(msg){ const b=document.createElement('div'); b.className='busy'; b.innerHTML='<div></div>'; b.firstChild.textContent=msg; document.body.appendChild(b); return () => b.remove(); }
function sheet(build){
  return new Promise(resolve => {
    const scrim = document.createElement('div'); scrim.className='scrim';
    const sh = document.createElement('div'); sh.className='sheet'; scrim.appendChild(sh);
    const close = v => { scrim.remove(); resolve(v); };
    scrim.addEventListener('pointerdown', e => { if(e.target===scrim) close(null); });
    build(sh, close);
    document.body.appendChild(scrim);
    const f = sh.querySelector('[autofocus]'); if(f) setTimeout(()=>{ f.focus(); f.select && f.select(); }, 50);
  });
}
function h(tag, attrs={}, ...kids){
  const el = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='class') el.className=v; else if(k.startsWith('on')) el.addEventListener(k.slice(2), v); else if(v!==false && v!=null) el.setAttribute(k, v===true?'':v); }
  for(const kid of kids.flat()) if(kid!=null) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}
function acts(...btns){ return h('div',{class:'acts'}, ...btns); }
function askText(title, value='', {label='Guardar', multiline=false, hint=''}={}){
  return sheet((sh, close) => {
    const inp = multiline ? h('textarea',{class:'field', autofocus:true}) : h('input',{class:'field', autofocus:true});
    inp.value = value;
    if(!multiline) inp.addEventListener('keydown', e => { if(e.key==='Enter') close(inp.value); });
    sh.append(h('h2',{},title), hint ? h('p',{},hint) : null, inp,
      acts(h('button',{class:'btn', onclick:()=>close(null)},'Cancelar'), h('button',{class:'btn pri', onclick:()=>close(inp.value)}, label)));
  });
}
function confirmSheet(title, msg, label='Eliminar'){
  return sheet((sh, close) => sh.append(h('h2',{},title), h('p',{},msg),
    acts(h('button',{class:'btn', onclick:()=>close(false)},'Cancelar'), h('button',{class:'btn danger', onclick:()=>close(true)}, label))));
}

/* ---------- PDF.js ---------- */
let pdfReady;
function initPdf(){
  if(pdfReady) return pdfReady;
  pdfReady = (async () => {
    if(!window.pdfjsLib) throw new Error('No se pudo cargar el lector de PDF');
    try {
      const r = await fetch(PDFJS_BASE + 'pdf.worker.min.js'); const t = await r.text();
      pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([t], {type:'text/javascript'}));
    } catch(e){ pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + 'pdf.worker.min.js'; }
  })();
  return pdfReady;
}
let mainThread = null;
function useMainThread(){
  // Respaldo: cargar el motor del PDF en la propia página si el worker no arranca
  if(!mainThread) mainThread = new Promise((res, rej) => { const s = document.createElement('script'); s.src = PDFJS_BASE + 'pdf.worker.min.js'; s.onload = res; s.onerror = () => rej(new Error('No se pudo cargar el motor de PDF')); document.head.appendChild(s); });
  return mainThread;
}
function withTimeout(p, ms){ return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('tiempo agotado')), ms))]); }
async function loadPdf(bytes){
  const open = () => { const task = pdfjsLib.getDocument({data: new Uint8Array(bytes.slice(0)), standardFontDataUrl: PDFJS_BASE + 'standard_fonts/', isEvalSupported:false}); return withTimeout(task.promise, 20000).catch(e => { try { task.destroy(); } catch(_){} throw e; }); };
  try { await withTimeout(initPdf(), 8000); if(!window.pdfjsWorker) return await open(); } catch(e){ console.warn('worker', e); }
  await useMainThread();
  return await open();
}

/* ---------- Biblioteca ---------- */
let notes = [], obras = [];
let curObra = prefs.obra || '', fZona = null, fInst = null, showOld = false;
const natural = (a, b) => a.localeCompare(b, 'es', {numeric:true, sensitivity:'base'});
async function refreshLib(){
  const all = await DB.all('notes');
  obras = all.filter(n => n.kind === 'obra').sort((a,b) => natural(a.name, b.name));
  notes = all.filter(n => n.kind !== 'obra').sort((a,b) => b.updated - a.updated);
  const CLASS_V = 9;
  if((prefs.classV || 0) < CLASS_V){
    for(const n of notes) if(n.kind === 'pdf' && !n.manualTags){ const c = classify(n.title); if(c.zona !== (n.zona||'') || c.inst !== (n.inst||'')){ n.zona = c.zona || n.zona || ''; n.inst = c.inst || n.inst || ''; await DB.put('notes', n.id, n); } }
    prefs.classV = CLASS_V; savePrefs();
  }
  if(curObra && !obras.find(o => o.id === curObra)) curObra = '';
  renderLib();
}
function chipBtn(label, on, fn, cls=''){ return h('button',{class:'chip ' + cls + (on ? ' on' : ''), onclick:fn}, label); }
function selObra(id){ curObra = id; prefs.obra = id; savePrefs(); fZona = fInst = null; $('#q').value = ''; renderLib(); }
function noteCard(n, small){
  const th = h('div',{class:'th'}); if(n.thumb) th.style.backgroundImage = `url(${n.thumb})`;
  const more = h('button',{class:'more', title:'Opciones', onclick:e => { e.stopPropagation(); noteMenu(n); }}, svgIcon('i-more'));
  const tags = [n.zona, n.inst].filter(Boolean).join(' · ');
  const sub = (n.superseded ? 'REV. ANTERIOR · ' : '') + (tags ? tags + ' · ' : '') + n.pages.length + (n.pages.length === 1 ? ' pág.' : ' págs.');
  const on = selMode && sel.has(n.id);
  const card = h('div',{class:'card' + (small ? ' sm' : '') + (n.archived ? ' arch' : '') + (on ? ' sel' : ''), role:'button', tabindex:'0', onclick:() => { if(lpFired){ lpFired = false; return; } if(selMode) toggleSel(n.id); else openNote(n.id); }},
    n.archived ? h('span',{class:'badge'}, 'Archivado') : null, selMode && !small ? h('span',{class:'ck'}, on ? '✓' : '') : null, th, h('div',{class:'meta'}, h('div',{class:'t'}, h('b',{}, n.title), h('span',{}, sub)), small || selMode ? null : more));
  if(!small) longPress(card, () => { if(!selMode) enterSel(); toggleSel(n.id); });
  return card;
}
/* Selección múltiple */
let selMode = false, sel = new Set(), lpFired = false, visibleIds = [];
function longPress(el, fn){
  let t = null, x0 = 0, y0 = 0;
  const clear = () => { clearTimeout(t); t = null; };
  el.addEventListener('pointerdown', e => { if(e.pointerType === 'mouse' && e.button !== 0) return; x0 = e.clientX; y0 = e.clientY; lpFired = false; clear(); t = setTimeout(() => { t = null; lpFired = true; if(navigator.vibrate) navigator.vibrate(15); fn(); }, 480); });
  el.addEventListener('pointermove', e => { if(t && Math.hypot(e.clientX - x0, e.clientY - y0) > 10) clear(); });
  ['pointerup','pointercancel','pointerleave'].forEach(ev => el.addEventListener(ev, clear));
  el.addEventListener('contextmenu', e => e.preventDefault());
}
function enterSel(){ selMode = true; sel.clear(); document.body.classList.add('selmode'); renderLib(); }
function exitSel(){ selMode = false; sel.clear(); document.body.classList.remove('selmode'); renderLib(); }
function toggleSel(id){ sel.has(id) ? sel.delete(id) : sel.add(id); renderLib(); }
function updSelBar(){
  $('#selBar').hidden = !selMode;
  $('#bSel').textContent = selMode ? 'Cancelar' : 'Seleccionar';
  if(!selMode) return;
  for(const id of [...sel]) if(!notes.find(n => n.id === id)) sel.delete(id);
  const k = sel.size;
  $('#sCount').textContent = k + (k === 1 ? ' seleccionado' : ' seleccionados');
  const allOn = visibleIds.length && visibleIds.every(id => sel.has(id));
  $('#sAll').textContent = allOn ? 'Quitar todos' : 'Seleccionar todos';
  ['#sMove','#sArch','#sDel'].forEach(b => $(b).disabled = !k);
  const ss = selNotes(), allArch = ss.length && ss.every(n => n.archived);
  $('#sArch').lastChild.textContent = allArch ? 'Recuperar' : 'Archivar';
  $('#sArch').disabled = !allArch && !ss.some(n => n.kind === 'pdf' && !n.archived);
}
$('#bSel').onclick = () => selMode ? exitSel() : enterSel();
$('#sCancel').onclick = exitSel;
$('#sAll').onclick = () => { const allOn = visibleIds.every(id => sel.has(id)); visibleIds.forEach(id => allOn ? sel.delete(id) : sel.add(id)); renderLib(); };
const selNotes = () => notes.filter(n => sel.has(n.id));
async function deleteNote(n){
  const an = await DB.get('ann', n.id);
  if(an) for(const pg of an.pages) for(const ph of (pg.photos||[])) await DB.del('photos', ph.photoId);
  await DB.del('notes', n.id); await DB.del('pdfs', n.id); await DB.del('ann', n.id); try { await DB.del('handles', n.id); } catch(e){}
}
$('#sDel').onclick = async () => {
  const list = selNotes(); if(!list.length) return;
  const withN = []; for(const n of list) if(await hasNotes(n.id)) withN.push(n);
  const k = list.length;
  if(!(await confirmSheet('Eliminar ' + k + (k === 1 ? ' plano' : ' planos'), 'Se borrarán de este dispositivo junto con sus anotaciones y fotos. No se puede deshacer.', 'Eliminar'))) return;
  if(withN.length && !(await confirmSheet('¿Seguro?', withN.length + (withN.length === 1 ? ' de ellos tiene' : ' de ellos tienen') + ' anotaciones (dibujos, textos, medidas o fotos) que se perderán: ' + withN.slice(0, 4).map(n => '«' + n.title + '»').join(', ') + (withN.length > 4 ? '…' : '') + '.', 'Eliminar igualmente'))) return;
  for(const n of list) await deleteNote(n);
  selMode = false; sel.clear(); document.body.classList.remove('selmode');
  await refreshLib(); toast(k + (k === 1 ? ' plano eliminado' : ' planos eliminados'));
};
async function recoverMany(list){
  let ok = 0, miss = 0; const b = busy('Recuperando…');
  for(let i = 0; i < list.length; i++){
    b(); const done = busy('Recuperando ' + (i+1) + ' de ' + list.length + '…');
    const fh = await getHandle(list[i].id);
    try { if(!fh) throw 0; const f = await fileFromHandle(fh); f.__fh = fh; await restoreFrom(list[i], f); ok++; } catch(e){ miss++; }
    done();
  }
  selMode = false; sel.clear(); document.body.classList.remove('selmode');
  await refreshLib();
  toast(ok + (ok === 1 ? ' plano recuperado' : ' planos recuperados') + (miss ? ' · ' + miss + ' hay que elegirlos a mano (tócalos)' : ''), 5000);
}
$('#sArch').onclick = async () => {
  if(selNotes().length && selNotes().every(n => n.archived)) return recoverMany(selNotes());
  const list = selNotes().filter(n => n.kind === 'pdf' && !n.archived); if(!list.length) return;
  const plain = [], withN = []; for(const n of list) (await hasNotes(n.id) ? withN : plain).push(n);
  let todo = plain;
  if(withN.length){
    const m = withN.length + (withN.length === 1 ? ' plano tiene' : ' planos tienen') + ' anotaciones. Al archivarlos se borra el PDF del móvil; las anotaciones se guardan, pero para verlas tendrás que volver a elegir el mismo PDF.';
    const inc = await sheet((sh, close) => sh.append(h('h2',{}, 'Hay planos con anotaciones'), h('p',{}, m),
      h('div',{class:'acts'}, h('button',{class:'btn', onclick:() => close(null)}, 'Cancelar'), plain.length ? h('button',{class:'btn', onclick:() => close(false)}, 'Solo los ' + plain.length + ' sin notas') : null, h('button',{class:'btn danger', onclick:() => close(true)}, 'Incluirlos'))));
    if(inc == null) return;
    if(inc){ if(!(await confirmSheet('¿Seguro que quieres archivarlos?', 'Segunda confirmación: se archivarán también ' + withN.length + (withN.length === 1 ? ' plano' : ' planos') + ' con anotaciones.', 'Archivar igualmente'))) return; todo = list; }
  } else if(!(await confirmSheet('Archivar ' + plain.length + (plain.length === 1 ? ' plano' : ' planos'), 'Se borra el PDF del móvil para liberar espacio. Siguen en la lista y puedes recuperarlos eligiendo el PDF otra vez.', 'Archivar'))) return;
  let fr = 0; for(const n of todo) fr += await archiveNote(n);
  selMode = false; sel.clear(); document.body.classList.remove('selmode');
  await refreshLib(); toast(todo.length + (todo.length === 1 ? ' plano archivado' : ' planos archivados') + (fr ? ' · ' + fmtMB(fr) + ' liberados' : ''));
};
$('#sMove').onclick = () => {
  const list = selNotes(); if(!list.length) return;
  sheet((sh, close) => {
    const m = h('div',{class:'menu'});
    [{id:'', name:'Sin obra'}, ...obras].forEach(o => m.append(h('button',{onclick:async () => { for(const n of list){ n.obra = o.id; await DB.put('notes', n.id, n); } close(); selMode = false; sel.clear(); document.body.classList.remove('selmode'); await refreshLib(); toast(list.length + ' movidos a ' + o.name); }}, o.name)));
    sh.append(h('h2',{}, 'Mover ' + list.length + ' a obra'), m);
  });
};
function renderLib(){
  updSpaceBtn();
  // obras
  const ob = $('#obras'); ob.innerHTML = '';
  ob.append(chipBtn('Todas', !curObra, () => selObra('')));
  obras.forEach(o => ob.append(chipBtn(o.name, curObra === o.id, () => curObra === o.id ? obraMenu(o) : selObra(o.id))));
  ob.append(chipBtn('+ Obra', false, newObra, 'add'));
  const o = obras.find(x => x.id === curObra);
  const q = $('#q').value.trim().toLowerCase();
  const inObraAll = notes.filter(n => !curObra || n.obra === curObra);
  const nOld = inObraAll.filter(n => n.superseded).length;
  const inObra = inObraAll.filter(n => showOld || !n.superseded);
  // filtros
  const fr = $('#filters'); fr.innerHTML = '';
  const zonas = [...new Set(inObra.map(n => n.zona || ''))].sort((a,b) => (a===''?1:0) - (b===''?1:0) || natural(a,b));
  const insts = [...new Set(inObra.map(n => n.inst || ''))].sort((a,b) => (a===''?1:0) - (b===''?1:0) || natural(a,b));
  if(fZona != null && !zonas.includes(fZona)) fZona = null;
  if(fInst != null && !insts.includes(fInst)) fInst = null;
  const row = (title, vals, cur, set, empty) => {
    if(!vals.some(v => v)) return;
    const sc = h('div',{class:'fchips'}), r = h('div',{class:'frow'}, h('span',{class:'fl'}, title), sc);
    sc.append(chipBtn('Todas', cur == null, () => { set(null); renderLib(); }));
    vals.forEach(v => sc.append(chipBtn(v || empty, cur === v, () => { set(cur === v ? null : v); renderLib(); })));
    fr.append(r);
  };
  row('Zona', zonas, fZona, v => fZona = v, 'Sin zona');
  row('Instalación', insts, fInst, v => fInst = v, 'Sin instalación');
  if(nOld) fr.append(h('div',{class:'frow'}, h('span',{class:'fl'}, 'Revisiones'), h('div',{class:'fchips'}, chipBtn(showOld ? 'Ocultar anteriores' : 'Ver anteriores (' + nOld + ')', showOld, () => { showOld = !showOld; renderLib(); }))));
  fr.querySelectorAll('.chip.on').forEach(c => { const p = c.parentElement; p.scrollLeft = c.offsetLeft - p.offsetLeft - (p.clientWidth - c.offsetWidth)/2; });
  const oc = ob.querySelector('.chip.on'); if(oc) ob.scrollLeft = oc.offsetLeft - ob.offsetLeft - (ob.clientWidth - oc.offsetWidth)/2;
  let list = inObra.filter(n => (fZona == null || (n.zona || '') === fZona) && (fInst == null || (n.inst || '') === fInst) && (!q || (n.title + ' ' + (n.zona||'') + ' ' + (n.inst||'')).toLowerCase().includes(q)));
  if(curObra) list.sort((a,b) => natural(a.title, b.title));
  // recientes
  const rc = $('#recent'); rc.innerHTML = '';
  if(!q && fZona == null && fInst == null && !selMode){
    const rec = inObra.filter(n => n.opened).sort((a,b) => b.opened - a.opened).slice(0, 6);
    if(rec.length && inObra.length > 4){ rc.append(h('div',{class:'sect'}, 'Recientes')); const strip = h('div',{class:'strip'}); rec.forEach(n => strip.append(noteCard(n, true))); rc.append(strip); rc.append(h('div',{class:'sect'}, 'Todos los planos (' + inObra.length + ')')); }
  }
  const g = $('#grid'); g.innerHTML = '';
  list.forEach(n => g.appendChild(noteCard(n)));
  visibleIds = list.map(n => n.id); $('#selRow').hidden = !list.length && !selMode; updSelBar();
  const em = $('#empty'); em.hidden = list.length > 0;
  if(!list.length && inObra.length) { em.innerHTML = '<b>Nada con ese filtro</b>Prueba con otra zona o instalación.'; }
  else if(!list.length) em.innerHTML = curObra ? '<b>Esta obra aún no tiene planos</b>Pulsa «Importar planos» y selecciona todos los PDF a la vez. Se clasifican solos por zona e instalación según el nombre del archivo.' : '<b>Aún no hay planos</b>Crea una obra con «+ Obra» e importa sus planos en PDF (puedes seleccionar muchos a la vez).';
}
function svgIcon(id){ const s=document.createElementNS('http://www.w3.org/2000/svg','svg'); s.setAttribute('class','i'); const u=document.createElementNS('http://www.w3.org/2000/svg','use'); u.setAttribute('href','#'+id); s.appendChild(u); return s; }
function fmtDate(t){ return new Date(t).toLocaleDateString('es-ES',{day:'numeric', month:'short', year:'numeric'}); }
async function newObra(){

function buildLines(texts){

function parseRunLen(str){

    const txt = 'El cajetín indica 1:' + fromHint.n + (fromHint.paper ? ' en ' + fromHint.paper : '') + (fromHint.paper && page && fromHint.paper !== page ? '; el PDF es ' + page + ', así que equivale a 1:' + fromHint.adj : '') + '.';

async function pickDim(pi, L){
  const A = await analyzePage(pi);
  const r = 26 / E.cam.z;
  let best = null;
  for(const t of A.texts){
    const d = parseDim(t.str); if(!d) continue;
    const dist = Math.hypot(L[0]-t.cx, L[1]-t.cy);
    if(dist < Math.max(r, t.w*0.7) && (!best || dist < best.dist)) best = {t, d, dist};
  }
  for(const t of A.lines){
    const d = parseRunLen(t.str); if(!d) continue;
    const dist = Math.hypot(L[0]-t.cx, L[1]-t.cy);
    if(dist < Math.max(r, t.w*0.6) && (!best || dist < best.dist)) best = {t, d, dist, run:true};
  }
  if(!best){ toast('No hay una cota legible ahí. Toca justo sobre el número, o usa «Calibrar a mano».', 4000); return; }
  const m = best.run ? matchRunLine(A, best.t) : matchDimLine(A, best.t);
  const shown = best.run ? 'L = ' + String(+best.d.v.toFixed(3)).replace('.', ',') + ' m' : best.t.str;
  if(!m){
    toast('He leído «' + shown + '» pero no encuentro su línea. Marca tú sus dos extremos.', 4500);
    E.calValue = best.run ? nf(best.d.v, 2) : best.t.str; setTool('cal'); return;
  }
  E.hl = {pi, p1:m.p1, p2:m.p2}; requestDraw(); $('#toast').hidden = true;
  const opts = scaleFromRatio(best.d.v / m.L, [best.d]);
  const forced = best.run ? 'm' : best.d.unit;
  setTool(prefs.lastTool && !['cal','cota'].includes(prefs.lastTool) ? prefs.lastTool : 'len');
  await sheet((sh, close) => {
    sh.append(h('h2',{}, (best.run ? 'Tramo «' : 'Cota «') + shown + '»'),
      h('p',{}, (best.run ? 'Tramo encontrado' : 'Línea de cota encontrada') + ' (resaltado en morado): ' + nf(m.L * PT_MM, 1) + ' mm en el papel. ' + (best.run ? 'Si el morado no cubre todo el tramo (por ejemplo, tiene codos), cancela y usa «Calibrar a mano» marcando sus extremos.' : '¿En qué unidad está la cota?')));
    const list = h('div',{class:'menu'});

    all.sort((a,b) => (opts[0] && b.u === opts[0].u) - (opts[0] && a.u === opts[0].u));

      list.append(h('button',{onclick:() => {
        const n = o.s || o.n;
        setScale(pi, {n:o.s || null, mmPerPt: o.s ? PT_MM * o.s : best.d.v * ({m:1000,cm:10,mm:1}[o.u]) / m.L, label: (o.s ? '1:' + o.s : 'calibrada ≈1:' + nf(o.n,0)) + ' (cota)'}, E.calAll !== false);

      }}, h('b',{style:'min-width:44px'}, o.u), 'Cota en ' + ({m:'metros', cm:'centímetros', mm:'milímetros'}[o.u]) + ' → escala ' + label + (o.s ? '' : ' (no estándar)')));

  });

async function deliver(name, bytes){

    if(window.claude && window.claude.use){
      const dl = await window.claude.use('downloads');

    }

    const f = new File([blob], name, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], title:name}); return; }
  } catch(e){ if(e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 30000);
}
function hexRgb(hx){ const n = parseInt(hx.slice(1), 16); return PDFLib.rgb(((n>>16)&255)/255, ((n>>8)&255)/255, (n&255)/255); }

  const safe = (f, s) => { try { f.encodeText(s); return s; } catch(e){ return [...s].map(ch => { try { f.encodeText(ch); return ch; } catch(_){ return '?'; } }).join(''); } };

    for(const s of A.strokes){
      const pts = []; for(let k=0;k<s.p.length;k+=3) pts.push([s.p[k], s.p[k+1]]);

      pg.drawSvgPath(path(pts), {x:0, y:0, borderColor:hexRgb(s.c), borderWidth:w, borderLineCap:LineCapStyle.Round, borderOpacity: s.t==='hl' ? 0.45 : 1, blendMode: s.t==='hl' ? BlendMode.Multiply : undefined});
    }

      t.txt.split('\n').forEach((ln, k) => { const r = conv(t.x, t.y + t.s*0.82 + k*t.s*1.25); pg.drawText(safe(font, ln), {x:r[0], y:r[1], size:t.s, font, color:hexRgb(t.c), rotate:degrees(ang)}); });

      const r1 = conv(a[0] - tw/2, a[1] + size*0.5 - 0.3*sc - (m.k==='area'?0:8*sc));

      pg.drawCircle({x:r[0], y:r[1], size:R, color:PDFLib.rgb(.12,.16,.27), borderColor:PDFLib.rgb(1,1,1), borderWidth:1*sc});
      const t = String(ph.n), ts = 7*sc, tw = fontB.widthOfTextAtSize(t, ts);
      pg.drawText(t, {x:r[0] - tw/2, y:r[1] - ts*0.36, size:ts, font:fontB, color:PDFLib.rgb(1,1,1)});
      fotos.push({pi:i, ph});
    }
  }
  fotos.sort((a,b) => a.ph.n - b.ph.n);
  let fp = null, slot = 0;
  for(const {pi, ph} of fotos){
    const rec = await DB.get('photos', ph.photoId); if(!rec) continue;
    if(!fp || slot === 2){ fp = doc.addPage([595.28, 841.89]); slot = 0; fp.drawText(safe(fontB, E.meta.title + ' · Fotos'), {x:40, y:805, size:11, font:fontB, color:PDFLib.rgb(.11,.12,.15)}); }
    const img = await doc.embedJpg(await rec.blob.arrayBuffer());
    const boxW = 515, boxH = 320, top = 785 - slot * 385;
    const k = Math.min(boxW / img.width, boxH / img.height), iw = img.width * k, ih = img.height * k;
    fp.drawImage(img, {x:40 + (boxW - iw)/2, y:top - ih, width:iw, height:ih});
    const head = 'Foto ' + ph.n + ' · página ' + (pi+1) + ' del plano · ' + new Date(ph.t).toLocaleString('es-ES', {dateStyle:'short', timeStyle:'short'});
    fp.drawText(safe(fontB, head), {x:40, y:top - boxH - 16, size:9.5, font:fontB, color:PDFLib.rgb(.11,.12,.15)});
    if(ph.caption){
      const words = safe(font, ph.caption.replace(/\s+/g,' ')).split(' '); let line = '', y = top - boxH - 30, n = 0;
      for(const w of words){ const tryL = line ? line + ' ' + w : w; if(font.widthOfTextAtSize(tryL, 9.5) > boxW && line){ fp.drawText(line, {x:40, y, size:9.5, font, color:PDFLib.rgb(.25,.27,.3)}); y -= 13; line = w; if(++n > 2) break; } else line = tryL; }
      if(line && n <= 2) fp.drawText(line, {x:40, y, size:9.5, font, color:PDFLib.rgb(.25,.27,.3)});
    }
    slot++;
  }
  return await doc.save();
}

// Actualiza la etiqueta de escala al moverse por el documento
let lastTagPage = -1;
setInterval(() => { if(E){ const p = currentPage(); if(p !== lastTagPage){ lastTagPage = p; updScaleTag(); } } }, 300);
(async () => { await DB.open(); refreshLib(); initPdf().catch(()=>{}); })();
if('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
/* Actualizaciones sin tener que cerrar la app */
const APP_V = '2026.11.11-13';
async function checkUpdate(manual){
  try {
    const r = await fetch('index.html?v=' + Date.now(), {cache:'no-store'}); if(!r.ok) throw 0;
    const m = (await r.text()).match(/const APP_V = '([^']+)'/);
    if(m && m[1] !== APP_V){ showUpdate(); return true; }
    if(manual) toast('Ya tienes la última versión');
  } catch(e){ if(manual) toast('Sin conexión: no se pudo comprobar'); }
  return false;
}
function showUpdate(){
  if($('#updBar')) return;
  const bar = h('div',{id:'updBar'}, h('span',{}, 'Hay una versión nueva de la app'), h('button',{class:'btn pri', onclick:() => location.reload()}, 'Actualizar'));
  document.body.appendChild(bar);
}
window.addEventListener('load', () => { setTimeout(() => checkUpdate(false), 1500); const vb = $('#bVer'); if(vb){ vb.textContent = 'Versión ' + APP_V + ' · Buscar actualización'; vb.onclick = () => checkUpdate(true); } });
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') checkUpdate(false); });
// Pedir almacenamiento persistente para que el sistema no borre las notas
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
})();
